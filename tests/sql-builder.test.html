<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<title>SQL builder tests</title>
<pre id="results">RUNNING</pre>
<script src="../data/physical-schema.generated.js"></script>
<script src="../data/schema.js"></script>
<script src="../js/sql-builder.js"></script>
<script src="../js/template-utils.js"></script>
<script src="../js/preset-store.js"></script>
<script src="../js/wizard-state.js"></script>
<script src="salary-control-dataset.js"></script>
<script>
  const results = [];
  function test(name, fn) {
    try { fn(); results.push({ name, ok: true }); }
    catch (error) { results.push({ name, ok: false, error: error.message }); }
  }
  function state(tables, extra = {}) {
    return Object.assign({ tables, fields: [], filters: [], orderBy: [], mode: "select" }, extra);
  }
  function result(input) {
    return SqlBuilder.build(input);
  }
  function includes(value, part, message = part) {
    if (!value.includes(part)) throw new Error(`Не знайдено: ${message}\n${value}`);
  }
  function equal(a, b, message) {
    if (a !== b) throw new Error(`${message || "Значення різняться"}\n${a}\n---\n${b}`);
  }

  test("порядок вибору таблиць не змінює SQL", () => {
    const a = result(state(["t6_2026_edrpou", "insured_person_info"]));
    const b = result(state(["insured_person_info", "t6_2026_edrpou"]));
    equal(a.sql, b.sql);
  });
  test("T6 is root and person info is LEFT JOIN without RIGHT JOIN", () => {
    const r = result(state(["insured_person_info", "t6_2026_edrpou"]));
    equal(r.errors.length, 0);
    includes(r.sql, "FROM vasiliuk_u.t6_2026_edrpou t6");
    includes(r.sql, "LEFT JOIN ikis_person.insured_person_info ipi");
    if (/\bRIGHT JOIN\b/.test(r.sql)) throw new Error("RIGHT JOIN generated");
  });
  test("cardinality reversal is explicit", () => {
    equal(SqlBuilder.reverseCardinality("1:N"), "N:1");
    equal(SqlBuilder.reverseCardinality("1:0..N"), "0..N:1");
    equal(SqlBuilder.reverseCardinality("N:0..1"), "0..1:N");
    equal(SqlBuilder.reverseCardinality("N:M"), "M:N");
  });
  test("user preset stores only constructor configuration", () => {
    const data = {};
    const storage = { getItem: key => data[key] || null, setItem: (key, value) => { data[key] = value; } };
    const saved = SQLPresetStore.save(storage, "Звіт КВЕД", {
      step: 5, tables: ["t6_2026_edrpou"], metrics: ["payroll"], filters: [], expandedCategories: new Set(["x"]), parallel8: true
    });
    equal(saved.name, "Звіт КВЕД");
    equal(saved.state.tables[0], "t6_2026_edrpou");
    equal(saved.state.parallel8, true);
    if ("step" in saved.state || "expandedCategories" in saved.state) throw new Error("Transient UI state was stored");
  });
  test("user preset with the same name is updated instead of duplicated", () => {
    const data = {};
    const storage = { getItem: key => data[key] || null, setItem: (key, value) => { data[key] = value; } };
    const first = SQLPresetStore.save(storage, "Мій звіт", { tables: ["t6_2026_edrpou"], metrics: ["payroll"] });
    const second = SQLPresetStore.save(storage, "мій звіт", { tables: ["t6_2026_edrpou"], metrics: ["contributions"] });
    equal(first.id, second.id);
    equal(SQLPresetStore.list(storage).length, 1);
    equal(SQLPresetStore.get(storage, first.id).state.metrics[0], "contributions");
  });
  test("damaged local preset storage does not break the constructor", () => {
    const storage = { getItem: () => "{damaged", setItem: () => {} };
    equal(SQLPresetStore.list(storage).length, 0);
  });
  test("user preset can be deleted", () => {
    const data = {};
    const storage = { getItem: key => data[key] || null, setItem: (key, value) => { data[key] = value; } };
    const saved = SQLPresetStore.save(storage, "Тимчасовий", { tables: ["t6_2026_edrpou"] });
    equal(SQLPresetStore.remove(storage, saved.id), true);
    equal(SQLPresetStore.list(storage).length, 0);
  });
  test("preset v2 includes semantic contract and migrates v1", () => {
    const snapshot = SQLPresetStore.snapshot({ tables: [], semanticMode: "all_history", allHistoryConfirmed: true, taskId: "payroll_esv", taskParameters: { year: 2026 }, qualityProfiles: ["accepted_actual_packages"] });
    equal(snapshot.schemaVersion, 2); equal(snapshot.semanticMode, "all_history"); equal(snapshot.allHistoryConfirmed, true);
    const migrated = SQLPresetStore.migrate({ id: "old", name: "old", state: { tables: [] } });
    equal(migrated.state.schemaVersion, 2); equal(migrated.state.semanticMode, "all_history"); equal(migrated.state.allHistoryConfirmed, false);
    const current = SQLPresetStore.migrate({ id: "old-current", name: "old-current", state: { presets: ["current_insurer_profile"] } });
    equal(current.state.semanticMode, "current");
  });
  test("preset JSON export and import validates schema version", () => {
    const data = {}; const storage = { getItem: key => data[key] || null, setItem: (key, value) => { data[key] = value; } };
    SQLPresetStore.save(storage, "A", { tables: ["t6_2026_edrpou"], semanticMode: "current" });
    const json = SQLPresetStore.exportJson(storage);
    equal(SQLPresetStore.importJson(storage, json, () => true), 1);
    let rejected = false; try { SQLPresetStore.importJson(storage, '{"schemaVersion":1,"presets":[]}'); } catch (_) { rejected = true; }
    if (!rejected) throw new Error("Incompatible preset import accepted");
  });
  test("wizard preview hides later-step settings without deleting them", () => {
    const full = {
      tables: ["t6_2026_edrpou"], joins: [{ id: "override" }],
      fields: [{ table: "t6_2026_edrpou", column: "reg", agg: "" }],
      metrics: ["payroll"], filters: [{ table: "t6_2026_edrpou", column: "year", op: "=", value: 2026 }],
      orderBy: [{ fieldIndex: 0, dir: "ASC" }], presets: ["current_insurer_profile"],
      parallel8: true, mode: "ctas", targetTable: "REPORT_1"
    };
    const sources = SQLWizardState.forStep(full, 1);
    equal(sources.fields.length, 0);
    equal(sources.filters.length, 0);
    equal(sources.orderBy.length, 0);
    equal(sources.mode, "select");
    equal(full.fields.length, 1, "Full state fields must survive back navigation");
    equal(full.filters.length, 1, "Full state filters must survive back navigation");
    const filters = SQLWizardState.forStep(full, 4);
    equal(filters.fields.length, 1);
    equal(filters.filters.length, 1);
    equal(filters.orderBy.length, 1);
  });
  test("три таблиці з проміжним зв’язком", () => {
    const r = result(state(["pinsur_ankt_a", "pinsur_main", "pinsur_chng_doc"]));
    equal(r.errors.length, 0);
    equal((r.sql.match(/\bJOIN\b/g) || []).length, 2);
  });
  test("непов’язаний граф повертає помилку без SQL", () => {
    const graph = SqlBuilder.resolveJoinGraph(["insured_person", "mrdorg"], [], []);
    if (!graph.errors.length) throw new Error("Очікувалася помилка непов’язаного графа");
  });
  test("складений JOIN APE46–APE45", () => {
    const r = result(state(["sm_ape4_6data", "sm_ape4_5data"]));
    includes(r.sql, "aped46_slb"); includes(r.sql, "aped45_slb");
    includes(r.sql, "aped46_numident"); includes(r.sql, "aped45_numident");
  });
  test("альтернативний JOIN особи використовує РНОКПП або паспортний ключ", () => {
    const joins = SqlBuilder.suggestJoinsForTables(["t6_2026_edrpou", "insured_person_info"]);
    joins[0].selectedVariant = "numident_or_passport";
    const r = result(state(["t6_2026_edrpou", "insured_person_info"], { joins }));
    includes(r.sql, "latest_person_identity");
    includes(r.sql, "sqlm_match_key");
    includes(r.sql, "'БК' || UPPER(TRIM(ipi_src.pass_serial))");
    includes(r.sql, "'П' || TRIM(ipi_src.pass_number)");
  });
  test("COUNT DISTINCT осіб", () => {
    const r = result(state(["t6_2026_edrpou"], { metrics: ["people_count"] }));
    includes(r.sql, "COUNT(DISTINCT t6.kod_zo)");
  });
  test("сторнування фонду оплати", () => {
    const r = result(state(["sm_packlabel", "sm_ape4_6data"], { metrics: ["raw_payroll"] }));
    includes(r.sql, "IN (3, 5, 7, 9, 12)"); includes(r.sql, "-ABS(pd.aped46_sum)");
  });
  test("DATE-фільтр перевіряється і форматується", () => {
    const good = result(state(["insured_person_info"], { filters: [{ table: "insured_person_info", column: "birth_dt", op: ">=", value: "2026-01-31" }] }));
    includes(good.sql, "DATE '2026-01-31'");
    const bad = result(state(["insured_person_info"], { filters: [{ table: "insured_person_info", column: "birth_dt", op: "=", value: "31.01.2026" }] }));
    if (!bad.errors.length) throw new Error("Некоректна дата не відхилена");
  });
  test("LIKE без регістру застосовує UPPER з обох боків", () => {
    const r = result(state(["insured_person_info"], { filters: [{ table: "insured_person_info", column: "ln_name", op: "LIKE_UPPER", value: "Іван" }] }));
    includes(r.sql, "UPPER(ipi.ln_name) LIKE UPPER('%Іван%')");
  });
  test("CTAS відхиляє дубльовані технічні аліаси", () => {
    const fields = [
      { table: "insured_person_info", column: "ln_name", outAlias: "name" },
      { table: "insured_person_info", column: "fn_name", outAlias: "NAME" }
    ];
    const r = result(state(["insured_person_info"], { mode: "ctas", targetTable: "work_result", fields }));
    if (!r.errors.length) throw new Error("Дубльовані аліаси не відхилені");
  });
  test("шаблон підставляє період і OTK для T6", () => {
    const sql = TemplateUtils.apply(
      "year between {{YEAR_START}} and {{YEAR_END}} month between {{MONTH_START}} and {{MONTH_END}} {{APED46_OTK_CONDITION}}",
      { yearStart: 2026, yearEnd: 2022, monthStart: 12, monthEnd: 3, otk: "1" }
    );
    includes(sql, "year between 2022 and 2026");
    includes(sql, "month between 03 and 12");
    includes(sql, "AND pd.aped46_otk = 1");
  });
  test("OTK не додається до шаблону для значення будь-яке", () => {
    const sql = TemplateUtils.apply("x {{APED46_OTK_CONDITION}} y", { otk: "any" });
    if (sql.includes("aped46_otk")) throw new Error("OTK не мав додаватися");
  });
  test("bridge: пакет до анкети A проходить через страхувальника і документ", () => {
    const r = result(state(["sm_packlabel", "pinsur_ankt_a"]));
    equal(r.errors.length, 0); equal((r.sql.match(/\bJOIN\b/g) || []).length, 3);
    includes(r.sql, "ikis_ersp.pinsur_main"); includes(r.sql, "ikis_ersp.pinsur_chng_doc");
  });
  test("bridge: T6 до КВЕД проходить правильний повний маршрут", () => {
    const r = result(state(["t6_2026_edrpou", "nsi_kved"]));
    ["pinsur_main", "pinsur_chng_doc", "pinsur_kved_hst", "pinsur_kved"].forEach((id) => {
      if (!r.graph.bridgeTables.includes(id)) throw new Error(`Немає bridge ${id}`);
    });
    includes(r.sql, "t6.slb_im = im.im_id"); includes(r.sql, "im.im_id = ih.ih_im");
    includes(r.sql, "ih.ih_ivh = ivh.ivh_id"); includes(r.sql, "ivh.ivh_id = kv.iv_ivh"); includes(r.sql, "kv.iv_kvd = k.kvd_id");
    if (/JOIN ikis_ersp\.pinsur_kved kv\s+ON ih\./.test(r.sql)) throw new Error("Знайдено заборонене скорочення документ → КВЕД");
  });
  test("bridge: анкета C до КВЕД проходить через документ і pinsur_kved", () => {
    const r = result(state(["pinsur_ankt_c", "nsi_kved"]));
    includes(r.sql, "ikis_ersp.pinsur_chng_doc"); includes(r.sql, "ikis_ersp.pinsur_kved_hst"); includes(r.sql, "ikis_ersp.pinsur_kved");
  });
  test("немає вигаданого прямого pinsur_main до nsi_kved", () => {
    const r = result(state(["pinsur_main", "nsi_kved"]));
    if (/im\.[^\n]+\s*=\s*k\./.test(r.sql)) throw new Error("Знайдено прямий JOIN");
    equal((r.sql.match(/\bJOIN\b/g) || []).length, 4);
  });
  test("анкета C при маршруті від страхувальника є LEFT JOIN", () => {
    const r = result(state(["pinsur_main", "pinsur_ankt_c"]));
    includes(r.sql, "LEFT JOIN ikis_ersp.pinsur_ankt_c iac");
  });
  test("bridge SQL стабільний при зворотному порядку endpoints", () => {
    const a = result(state(["t6_2026_edrpou", "nsi_kved"]));
    const b = result(state(["nsi_kved", "t6_2026_edrpou"]));
    equal(a.sql, b.sql);
  });
  test("bridge-поля не потрапляють у SELECT автоматично", () => {
    const r = result(state(["t6_2026_edrpou", "nsi_kved"]));
    const select = r.sql.slice(0, r.sql.indexOf("FROM"));
    includes(select, "t6.*"); includes(select, "k.*");
    if (/\b(im|ih|ivh|kv)\.\*/.test(select)) throw new Error("Bridge-поля потрапили у SELECT");
  });
  test("кожна таблиця маршруту з’являється у FROM/JOIN один раз", () => {
    const r = result(state(["t6_2026_edrpou", "nsi_kved"]));
    ["vasiliuk_u.t6_2026_edrpou", "ikis_ersp.pinsur_main", "ikis_ersp.pinsur_chng_doc", "ikis_ersp.pinsur_kved_hst", "ikis_ersp.pinsur_kved", "ikis_ndi.nsi_kved"].forEach((name) => {
      const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      equal((r.sql.match(new RegExp(`(?:FROM|JOIN)\\s+${escaped}\\s`, "g")) || []).length, 1, `Дубльовано ${name}`);
    });
  });
  test("preset актуального профілю додає три семантичні фільтри", () => {
    const r = result(state(["t6_2026_edrpou", "nsi_kved"], { presets: ["current_insurer_profile"] }));
    includes(r.sql, "im.im_st IN ('A', 'L')"); includes(r.sql, "ih.ih_st_actual = 'A'"); includes(r.sql, "kv.iv_tp = 'Y'");
  });
  test("без preset фільтри актуального профілю відсутні", () => {
    const r = result(state(["t6_2026_edrpou", "nsi_kved"]));
    ["im.im_st IN", "ih.ih_st_actual", "kv.iv_tp = 'Y'"].forEach((part) => { if (r.sql.includes(part)) throw new Error(`Зайвий фільтр ${part}`); });
  });
  test("history route не змішується з current pointer", () => {
    const r = result(state(["pinsur_main", "pinsur_chng_doc"]));
    includes(r.sql, "im.im_id = ih.ih_im");
    if (r.sql.includes("im.im_ih = ih.ih_id")) throw new Error("Маршрути змішані");
  });
  test("ланцюг 1:N до КВЕД попереджає про розмноження сум", () => {
    const r = result(state(["t6_2026_edrpou", "nsi_kved"]));
    const item = (r.diagnostics || []).find((diagnostic) => diagnostic.code === "FANOUT_RISK");
    if (!item || item.severity !== "warning" || !item.action) throw new Error("Немає структурованої FANOUT_RISK діагностики");
  });
  test("all_history requires explicit fanout confirmation", () => {
    const blocked = result(state(["pinsur_main"], { semanticMode: "all_history" }));
    if (!blocked.errors.length) throw new Error("all_history accepted without confirmation");
    const accepted = result(state(["pinsur_main"], { semanticMode: "all_history", allHistoryConfirmed: true }));
    equal(accepted.errors.length, 0);
  });
  test("quality profile system filters are explicit", () => {
    const plain = result(state(["sm_packlabel", "sm_ape4_6data"]));
    if (plain.sql.includes("plb.slb_fixed = 'Y'")) throw new Error("Hidden system filter applied");
    const filtered = result(state(["sm_packlabel", "sm_ape4_6data"], { qualityProfiles: ["accepted_actual_packages"] }));
    includes(filtered.sql, "plb.slb_fixed = 'Y'"); includes(filtered.sql, "pd.aped46_st = 'O'");
    if (!(filtered.appliedPredicates || []).length) throw new Error("Applied predicates are not exposed");
  });
  test("external FK remains catalogued but is unavailable to routing", () => {
    const external = SQL_SCHEMA.physicalJoins.find((edge) => edge.unresolvedExternal);
    if (!external || !external.externalTarget || external.isDefault !== false) throw new Error("External FK metadata is incomplete");
    if (SqlBuilder.normalizedEdges({}).some((edge) => edge.id === external.id)) throw new Error("External FK entered routing graph");
  });
  test("all routable catalog edges build without RIGHT JOIN", () => {
    const pairs = new Set(SqlBuilder.normalizedEdges({}).filter((edge) => edge.isDefault).map((edge) => [edge.left, edge.right].sort().join("|")));
    pairs.forEach((key) => {
      const ids = key.split("|"); let r;
      try { r = result(state(ids)); } catch (error) { throw new Error(`${key}: ${error.message}`); }
      if (!r.errors.length && /\bRIGHT JOIN\b/.test(r.sql)) throw new Error(`RIGHT JOIN: ${key}`);
    });
  });

  test("DDL: APE 4-5 data приєднується до заголовка за пакетом і сторінкою", () => {
    const r = result(state(["sm_ape4_5data", "sm_ape4_5"]));
    includes(r.sql, "a45.ape45_slb = d5.aped45_slb");
    includes(r.sql, "a45.ape45_page = d5.aped45_page");
  });
  test("DDL: APE 4-6 data приєднується до заголовка за пакетом і сторінкою", () => {
    const r = result(state(["sm_ape4_6data", "sm_ape4_6"]));
    includes(r.sql, "pd.aped46_slb = a46.ape46_slb");
    includes(r.sql, "pd.aped46_page = a46.ape46_page");
  });
  test("маршрут усіх версій КВЕД доступний лише як явний override", () => {
    const normal = result(state(["pinsur_main", "nsi_kved"]));
    includes(normal.sql, "im.im_id = ih.ih_im");
    const explicit = result(state(["pinsur_main", "nsi_kved"], {
      joins: [{ id: "insurer_to_all_kved_versions", isDefault: true, weight: 1 }]
    }));
    includes(explicit.sql, "im.im_id = ivh.ivh_im");
    if (explicit.sql.includes("ikis_ersp.pinsur_chng_doc")) throw new Error("Явний маршрут усіх версій не повинен додавати документ змін");
  });

  test("людина та підприємство зв’язуються через кадрові події APE 4-5 і пакет", () => {
    const fields = [
      { table: "insured_person_info", column: "numident" },
      { table: "sm_ape4_5data", column: "aped45_date_hire" },
      { table: "sm_ape4_5data", column: "aped45_date_fire" },
      { table: "sm_ape4_5data", column: "aped45_position" },
      { table: "pinsur_main", column: "im_id" }
    ];
    const r = result(state(["insured_person_info", "sm_ape4_5data", "pinsur_main"], { fields }));
    equal(r.errors.length, 0);
    includes(r.sql, "ipi.numident = d5.aped45_numident");
    includes(r.sql, "d5.aped45_slb = plb.slb_id");
    includes(r.sql, "plb.slb_im = im.im_id");
    includes(r.sql, "d5.aped45_date_hire");
    includes(r.sql, "d5.aped45_date_fire");
    includes(r.sql, "d5.aped45_position");
    if (r.sql.includes("t6_2026_edrpou")) throw new Error("Для явно вибраного APE 4-5 не потрібна bridge-таблиця T6");
    if (!r.warnings.some((warning) => /кадрових подій/.test(warning))) throw new Error("Немає попередження про множинні кадрові події");
  });
  test("маршрут людина–APE 4-5–підприємство не залежить від порядку вибору", () => {
    const a = result(state(["insured_person_info", "sm_ape4_5data", "pinsur_main"]));
    const b = result(state(["pinsur_main", "sm_ape4_5data", "insured_person_info"]));
    equal(a.sql, b.sql);
  });

  test("за замовчуванням приєднуються всі картки особи без latest CTE", () => {
    const r = result(state(["t6_2026_edrpou", "insured_person_info"]));
    includes(r.sql, "ikis_person.insured_person_info ipi");
    if (r.sql.includes("latest_person_info") || r.sql.includes("sqlm_rn = 1")) throw new Error("Неявно застосовано лише останню картку");
  });
  test("фільтр останньої картки явно додає ROW_NUMBER для T6", () => {
    const r = result(state(["t6_2026_edrpou", "insured_person_info"], { latestPersonOnly: true }));
    includes(r.sql, "latest_person_info AS");
    includes(r.sql, "ROW_NUMBER() OVER (PARTITION BY numident ORDER BY modify_dt DESC NULLS LAST, ip_id DESC)");
    includes(r.sql, "WHERE sqlm_rn = 1");
  });
  test("фільтр останньої картки однаково працює для APE 4-5", () => {
    const all = result(state(["insured_person_info", "sm_ape4_5data"]));
    if (all.sql.includes("latest_person_info")) throw new Error("APE 4-5 не має дедуплікувати картки за замовчуванням");
    const latest = result(state(["insured_person_info", "sm_ape4_5data"], { latestPersonOnly: true }));
    includes(latest.sql, "latest_person_info AS");
    includes(latest.sql, "FROM latest_person_info ipi");
  });

  test("робоча T6 приєднується до APE 4-5 без insured_person_info", () => {
    const r = result(state(["t6_2026_edrpou", "sm_ape4_5data"]));
    includes(r.sql, "ape45_employment_with_period AS");
    includes(r.sql, "t6.slb_im = d5.sqlm_slb_im");
    includes(r.sql, "t6.kod_zo = d5.aped45_numident");
    if (r.sql.includes("t6.year = d5.sqlm_year") || r.sql.includes("t6.aped46_mnth = d5.sqlm_month")) throw new Error("Стандартний маршрут має повертати всі посади, а не лише посади за місяць T6");
    if (r.sql.includes("insured_person_info") || r.sql.includes("latest_person_info")) throw new Error("Зайва картка особи у маршруті T6 → APE 4-5");
