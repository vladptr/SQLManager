<!doctype html><html lang="uk"><meta charset="utf-8"><body>
<div id="sql-status"></div><textarea id="sql-out">SELECT * FROM dual</textarea>
<span id="oracle-health-dot"></span><span id="oracle-export-status"></span>
<select id="oracle-export-format"><option value="xlsx">xlsx</option><option value="csv">csv</option></select>
<button id="btn-oracle-export"></button><button id="btn-oracle-cancel" disabled></button><button id="btn-oracle-health"></button><pre id="results"></pre>
<script>
var initialFetch=window.fetch;window.fetch=function(){return Promise.reject(new Error("offline"));};
URL.createObjectURL=function(){return "blob:test";};URL.revokeObjectURL=function(){};HTMLAnchorElement.prototype.click=function(){window.__downloaded=this.download;};
</script><script src="../js/oracle-export.js"></script><script>
(async function(){var results=[];async function test(name,fn){try{await fn();results.push({name:name,ok:true});}catch(e){results.push({name:name,ok:false,error:String(e.message||e)});}}function assert(v,m){if(!v)throw new Error(m);}
await new Promise(function(resolve){setTimeout(resolve,0);});
await test("agent unavailable does not break UI",async function(){await SQLManagerOracleExport.checkHealth();assert(document.getElementById("oracle-export-status").textContent.indexOf("не підключено")>=0,"offline status missing");});
await test("health success shows connected",async function(){window.fetch=async function(){return {ok:true,json:async function(){return {ok:true,user:"TEST",connection:"LOCAL"};}};};await SQLManagerOracleExport.checkHealth();assert(document.getElementById("oracle-health-dot").classList.contains("connected"),"not connected");assert(!document.getElementById("btn-oracle-export").disabled,"button disabled");});
await test("health failure shows unavailable",async function(){window.fetch=async function(){throw new Error("network")};await SQLManagerOracleExport.checkHealth();assert(document.getElementById("oracle-health-dot").classList.contains("error"),"failure missing");});
await test("export sends current SQL and downloads XLSX",async function(){var sent="";window.fetch=async function(url,options){sent=JSON.parse(options.body).sql;return {ok:true,blob:async function(){return new Blob(["x"]);},headers:{get:function(name){return name==="Content-Disposition"?'attachment; filename="result.xlsx"':null;}}};};await SQLManagerOracleExport.checkHealth();window.fetch=async function(url,options){sent=JSON.parse(options.body).sql;return {ok:true,blob:async function(){return new Blob(["x"]);},headers:{get:function(name){return name==="Content-Disposition"?'attachment; filename="result.xlsx"':null;}}};};await SQLManagerOracleExport.exportQuery();assert(sent==="SELECT * FROM dual","wrong SQL");assert(window.__downloaded==="result.xlsx","xlsx not downloaded");});
await test("CSV response downloads",async function(){document.getElementById("oracle-export-format").value="csv";window.fetch=async function(url,options){return {ok:true,blob:async function(){return new Blob(["x"]);},headers:{get:function(name){return name==="Content-Disposition"?'attachment; filename="result.csv"':null;}}};};await SQLManagerOracleExport.exportQuery();assert(window.__downloaded==="result.csv","csv not downloaded");});
await test("button disabled while request executes",async function(){var release;window.fetch=function(){return new Promise(function(resolve){release=resolve;});};var pending=SQLManagerOracleExport.exportQuery();assert(document.getElementById("btn-oracle-export").disabled,"button enabled while pending");release({ok:false,json:async function(){return {error:"ORA-00942"};},text:async function(){return "ORA-00942";}});await pending;assert(document.getElementById("oracle-export-status").textContent.indexOf("ORA-00942")>=0||document.getElementById("oracle-export-status").textContent.indexOf("не підключено")>=0,"ORA error missing");});
await test("cancel button calls local cancellation endpoint",async function(){var called="";window.fetch=async function(url){called=url;return {ok:true,json:async function(){return {ok:true};}};};document.getElementById("btn-oracle-cancel").disabled=false;await SQLManagerOracleExport.cancelQuery();assert(called.indexOf("/api/query/cancel")>=0,"cancel endpoint not called");assert(document.getElementById("oracle-export-status").textContent.indexOf("зупинено")>=0,"cancel status missing");});
var failed=results.filter(function(x){return!x.ok;}).length;document.getElementById("results").textContent=JSON.stringify({passed:results.length-failed,failed:failed,results:results});
})();
</script></body></html>
