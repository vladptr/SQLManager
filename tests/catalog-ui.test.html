<!doctype html><html lang="uk"><meta charset="utf-8"><title>Catalog UI tests</title><body>
<iframe id="app" src="../index.html" style="width:1200px;height:900px"></iframe><pre id="results"></pre>
<script>(function(){
var results=[];function test(name,fn){try{fn();results.push({name:name,ok:true});}catch(e){results.push({name:name,ok:false,error:String(e.message||e)});}}
function assert(value,message){if(!value)throw new Error(message);}
document.getElementById("app").addEventListener("load",function(){setTimeout(function(){
var frame=document.getElementById("app").contentWindow,doc=frame.document,api=frame.SQLManagerApp,schema=frame.SQL_SCHEMA,ui=frame.SQL_CATALOG_UI;
test("physical catalog remains complete",function(){var physical={};schema.physicalCatalog.tables.forEach(function(table){physical[table.fullName.toUpperCase()]=true;});var manualOnly=schema.tables.filter(function(table){return !physical[table.fullName.toUpperCase()];}).length;assert(schema.tables.length===schema.physicalCatalog.tables.length+manualOnly,"catalog merge incomplete: "+schema.tables.length);});
test("core tables render on first screen",function(){var cards=doc.querySelectorAll(".table-card");assert(cards.length>0&&cards.length<schema.tables.length,"initial cards: "+cards.length);Array.prototype.forEach.call(cards,function(card){assert(ui.get(schema.getTable(card.dataset.tableId)).visibility==="core","non-core initial card");});});
test("advanced and technical stay out of initial DOM",function(){assert(!doc.querySelector('[data-table-id="sm_ape4_5"]'),"advanced rendered");var t=schema.tables.find(function(x){return ui.get(x).visibility==="technical";});assert(t&&!doc.querySelector('[data-table-id="'+t.id+'"]'),"technical rendered");});
test("business categories are lazy",function(){api.setCatalogMode("business");assert(doc.querySelectorAll(".category-toggle").length>1,"headers missing");assert(doc.querySelectorAll(".table-card").length===0,"collapsed cards rendered");api.toggleCategory("employment");assert(doc.querySelectorAll(".table-card").length>0,"expand failed");});
test("technical mode reveals technical sources",function(){api.setCatalogMode("technical");var cards=doc.querySelectorAll(".table-card");assert(cards.length>0,"technical cards missing");Array.prototype.forEach.call(cards,function(card){assert(ui.get(schema.getTable(card.dataset.tableId)).visibility==="technical","wrong technical card");});});
test("search finds hidden advanced source",function(){api.setCatalogSearch("SM_APE4_5");assert(doc.querySelector('[data-table-id="sm_ape4_5"]'),"advanced not found");});
test("search finds technical without mode",function(){var t=schema.tables.find(function(x){return ui.get(x).visibility==="technical";});api.setCatalogMode("core");api.setCatalogSearch(ui.tableName(t));assert(doc.querySelector('[data-table-id="'+t.id+'"]'),"technical not found");});
test("search finds physical column",function(){api.setCatalogSearch("APED46_SUM_NARAH");var card=doc.querySelector('[data-table-id="sm_ape4_6data"]');assert(card,"column not found");assert(card.querySelector(".match-reason").textContent.toUpperCase().indexOf("APED46_SUM_NARAH")>=0,"reason missing: "+card.querySelector(".match-reason").textContent);});
test("every catalog table is searchable",function(){schema.tables.forEach(function(table){assert(ui.search(table.fullName).some(function(item){return item.table.id===table.id;}),"not searchable: "+table.fullName);});});
test("search renders top 30 and show more",function(){api.setCatalogSearch("IKIS");assert(doc.querySelectorAll(".table-card").length<=30,"more than 30 cards rendered");assert(doc.querySelector(".catalog-show-more"),"show more missing");});
test("catalog metadata is escaped",function(){var table={id:"xss_fixture",fullName:"WORK.XSS_FIXTURE",name:"XSS_FIXTURE",label:'<img src=x onerror="window.__xss=1">',description:'<script>window.__xss=1<\/script>',columns:[]};schema.tables.push(table);api.setCatalogSearch("XSS_FIXTURE");var card=doc.querySelector('[data-table-id="xss_fixture"]');assert(card,"fixture missing");assert(!card.querySelector("img")&&!card.querySelector("script"),"catalog HTML executed");assert(!frame.__xss,"XSS marker set");schema.tables.pop();api.setCatalogSearch("");});
test("selection does not rerender catalog",function(){var card=doc.querySelector(".table-card"),before=api.getCatalogRenderCount();api.toggleTable(card.dataset.tableId);assert(api.getCatalogRenderCount()===before,"catalog rerendered");assert(card.classList.contains("selected"),"selected class missing");});
test("selection survives rerender",function(){var id=api.getState().tables[0];api.setCatalogSearch(schema.getTable(id).fullName);assert(doc.querySelector('[data-table-id="'+id+'"]').classList.contains("selected"),"selection lost");});
test("category counters reflect selection",function(){api.setCatalogSearch("");api.setCatalogMode("business");var id=api.getState().tables[0],category=ui.get(schema.getTable(id)).category,counter=doc.querySelector('[data-category-count="'+category+'"]');assert(counter&&counter.textContent.indexOf("вибрано 1")>=0,"counter wrong");});
test("bridge graph remains available",function(){var bridge=schema.getTable("pinsur_kved_hst");assert(bridge&&ui.get(bridge).routeBridge,"bridge metadata missing");assert(schema.joins.some(function(j){return j.left===bridge.id||j.right===bridge.id;}),"bridge edges missing");});
test("empty state is neutral",function(){api.getState().tables.slice().forEach(function(id){api.toggleTable(id);});assert(!doc.querySelector("#sql-status").classList.contains("error"),"empty state shown as error");assert(doc.querySelector("#sql-out").value==="","empty state contains SQL error");});
test("normal metric toggles off on second click",function(){api.toggleTable("t6_2026_edrpou");api.goToStep(3);var button=Array.prototype.find.call(doc.querySelectorAll("#metrics-list button"),function(x){return x.textContent===schema.metrics.find(function(m){return m.id==="payroll";}).label;});assert(button,"payroll button missing");button.click();assert(api.getState().metrics.indexOf("payroll")>=0,"payroll not selected");button=Array.prototype.find.call(doc.querySelectorAll("#metrics-list button"),function(x){return x.textContent===schema.metrics.find(function(m){return m.id==="payroll";}).label;});button.click();assert(api.getState().metrics.indexOf("payroll")<0,"payroll not removed");});
test("ready report combines years and applies source period and region",function(){var inputs=doc.querySelectorAll('#ready-years input');Array.prototype.forEach.call(inputs,function(input){input.checked=[2024,2025,2026].indexOf(Number(input.value))>=0;});inputs[3].dispatchEvent(new Event("change",{bubbles:true}));var from=doc.querySelector("#ready-month-from"),to=doc.querySelector("#ready-month-to"),region=doc.querySelector("#ready-region");from.value="5";to.value="5";region.value="5";from.dispatchEvent(new Event("change",{bubbles:true}));to.dispatchEvent(new Event("change",{bubbles:true}));region.dispatchEvent(new Event("input",{bubbles:true}));var reports=doc.querySelectorAll(".ready-report-card");reports[2].click();api.goToStep(5);var sql=doc.querySelector("#sql-out").value;assert(sql.indexOf("t6_selected_years AS")>=0,"multi-year CTE missing");assert((sql.match(/UNION ALL/g)||[]).length===2,"wrong UNION ALL count");assert((sql.match(/aped46_mnth BETWEEN 5 AND 5/g)||[]).length===3,"month source filter missing");assert((sql.match(/reg = '5'/g)||[]).length===3,"region source filter missing");});
test("month selects and grain controls stay synchronized",function(){var from=doc.querySelector("#ready-month-from"),to=doc.querySelector("#ready-month-to");from.value="8";to.value="5";from.dispatchEvent(new Event("change",{bubbles:true}));assert(to.value==="8","month to did not follow month from");to.value="3";to.dispatchEvent(new Event("change",{bubbles:true}));assert(from.value==="3","month from did not follow month to");var grain=doc.querySelector("#ready-grain");grain.value="person_employer_month";grain.dispatchEvent(new Event("change",{bubbles:true}));assert(doc.querySelector('[name="salary-grain"][value="person_employer_month"]').checked,"result grain did not follow dropdown");var person=doc.querySelector('[name="salary-grain"][value="person_month"]');person.click();assert(grain.value==="person_month","dropdown did not follow result grain");});
test("DDL labels are escaped in filter sort and explain",function(){var table=schema.getTable("t6_2026_edrpou"),column=table.columns.find(function(c){return c.name==="reg";}),metric=schema.metrics.find(function(m){return m.id==="payroll";}),oldT=table.label,oldC=column.label,oldM=metric.label,payload='<img src=x onerror="parent.__xss=1">';table.label=payload;column.label=payload;metric.label=payload;var s=api.getState();s.tables=[table.id];s.fields=[{table:table.id,column:column.name,agg:""}];s.orderBy=[{fieldIndex:0,dir:"ASC"}];s.filters=[{table:table.id,column:column.name,op:"=",value:payload}];s.metrics=[metric.id];api.goToStep(3);assert(!doc.querySelector("#order-list img"),"sort label executed");api.goToStep(4);assert(!doc.querySelector("#filters-list img"),"filter label executed");api.goToStep(5);assert(!doc.querySelector("#sql-explain img"),"explain label executed");assert(!window.__xss,"XSS marker set");table.label=oldT;column.label=oldC;metric.label=oldM;s.fields=[];s.orderBy=[];s.filters=[];s.metrics=[];});
test("mobile viewport has no horizontal overflow",function(){var iframe=document.getElementById("app"),old=iframe.style.width;iframe.style.width="390px";doc.documentElement.style.overflowX="visible";doc.body.style.overflowX="visible";api.goToStep(5);void doc.documentElement.offsetWidth;var limit=doc.documentElement.clientWidth+1;assert(doc.documentElement.scrollWidth<=limit,"mobile overflow: "+doc.documentElement.scrollWidth+"/"+doc.documentElement.clientWidth);[".panel-card","#sql-out",".steps"].forEach(function(selector){var el=doc.querySelector(selector);assert(el&&el.getBoundingClientRect().right<=limit,"overflow in "+selector);});iframe.style.width=old;});
var metrics={visibility:{},categories:{},core:[],ambiguous:[]};schema.tables.forEach(function(table){var cfg=ui.get(table),name=ui.tableName(table);metrics.visibility[cfg.visibility]=(metrics.visibility[cfg.visibility]||0)+1;metrics.categories[cfg.category]=(metrics.categories[cfg.category]||0)+1;if(cfg.visibility==="core")metrics.core.push(name);if(!ui.tables[name]&&cfg.category==="report_packages")metrics.ambiguous.push(name);});
var failed=results.filter(function(x){return!x.ok;}).length;document.getElementById("results").textContent=JSON.stringify({passed:results.length-failed,failed:failed,results:results,metrics:metrics});
},150);});})();</script></body></html>
